[package]
name = "cygnus-programme"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Cygnus humanitarian aid disbursement programme contract"
repository = "https://github.com/Cygnus-aid-disbursement/cygnus-contracts"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
